# Builds the API server image and checks that it starts and answers.
# This is the only place the Dockerfile is exercised: there is no Docker on the development machine.
name: Server image

on:
  push:
    branches: [dev]
    paths: ["Dockerfile", "requirements.txt", "server/**", "spx/**", "scripts/make_submit_xsd.py", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg SPX_COMMIT=${GITHUB_SHA::7} -t spx-blink .
      - name: Start
        run: |
          docker run -d --name spx -p 8000:8000 spx-blink
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
      - name: Health says what we expect
        run: |
          python3 - <<'PY'
          import json
          h = json.load(open("health.json"))
          print({k: h.get(k) for k in ("ok", "commit", "ades_schema", "max_fov_deg", "astrometry_validation")})
          assert h.get("ok") is True, "health not ok"
          assert h.get("ades_schema") is True, "ADES schema missing in the image"
          v = h.get("astrometry_validation") or {}
          assert v.get("status") == "complete", f"validation file not complete in the image: {v}"
          assert v.get("same_frame_code") is True, f"validation made with other frame code: {v}"
          ix = h.get("image_index") or {}
          print("image index:", ix)
          assert (ix.get("rows") or 0) >= 1_600_000, f"our image index is missing from the image: {ix}"
          PY
      - name: Gallery data and catalogue are served
        run: |
          c=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/api/catwise?key=wise-0855"); echo "catwise wise-0855: $c"; test "$c" = 200
          b=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:8000/api/band?key=wise-0855&band=w1_2"); echo "bad band: $b"; test "$b" = 400
          t=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d "[]" "http://127.0.0.1:8000/api/track"); echo "malformed track body: $t"; test "$t" = 400
          docker exec spx sh -c 'echo "user: $(id -un)  cache: $SPX_CACHE  max fov: $SPX_MAX_FOV_DEG"'
      - name: A free field from our own index (must work whatever IRSA does)
        run: |
          curl -sS -m 120 -o free.json -w "free field manifest: %{http_code} %{time_total}s\n" "http://127.0.0.1:8000/api/manifest?ra=266.4168&dec=-29.0078&queue=0"
          python3 - <<'PY'
          import json
          m = json.load(open("free.json"))
          print(m.get("key"), m.get("n_images"), "images,", len(m.get("epochs", [])), "passes;", m.get("image_list"))
          assert (m.get("n_images") or 0) > 0, "no images for a free field"
          assert "our own index" in (m.get("image_list") or ""), "the list did not come from our index"
          PY
      - name: A field list from the archive (IRSA may be slow; reported, not required)
        continue-on-error: true
        run: |
          curl -sS -m 60 -o manifest.json -w "manifest: %{http_code} %{time_total}s\n" "http://127.0.0.1:8000/api/manifest?target=wise-0855&queue=0"
          python3 -c "import json;m=json.load(open('manifest.json'));print(m.get('key'), len(m.get('epochs',[])), 'epochs', m.get('n_images'), 'images', m.get('message'))"
      - name: Server log
        if: always()
        run: docker logs spx 2>&1 | tail -40

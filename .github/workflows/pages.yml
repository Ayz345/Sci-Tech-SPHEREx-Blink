# Publishes web/ to GitHub Pages exactly as it is in the repository:
#   /        the landing page
#   /tool/   the full tool
#   /data/   the prebuilt gallery of the five challenge targets
# The gallery works without a server. Free coordinates need the API server:
# set the repository variable SPX_API_URL to its https address and run this workflow again.
name: Publish the static page

on:
  push:
    branches: [dev]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        env:
          SPX_API_URL: ${{ vars.SPX_API_URL }}
        run: |
          mkdir site
          cp -r web/. site/
          # developer fixtures are synthetic test data; they do not belong on the public site
          rm -rf site/tool/dev-fixtures site/tool/README.md
          printf '// Written at publish time. "" = gallery only (no live server).\nwindow.SPX_API = "%s";\n' "${SPX_API_URL}" > site/config.js
          du -sh site site/tool site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
